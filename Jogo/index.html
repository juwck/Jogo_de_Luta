<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Jogo de Luta</title>
    <style>
        * {
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <!--conteiner vermelho-->
    <div style="position: relative; display: inline-block;" >
        <!--conteiner vermelho menor-->
        <div style="
        position: absolute;
        display: flex;
        width: 100%;
        align-items: center;
        padding: 20px;">
        
        <!--vida do player-->
        <div style="position: relative;  height: 30px; width: 100%; display: flex; justify-content: flex-end;">
            <div style="background-color: yellow; height: 30px; width: 100%;"></div>
            <div id="playerVida" style="position: absolute; background-color: blue;  top: 0; right: 0; bottom: 0; width: 100%;"></div>
        </div>
        <!--timer-->
        <div id="timer" style="background-color: red; width: 100px; height: 100px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
            10
        </div>
        
        <!--vida inimigo-->
        <div style="position: relative;  height: 30px; width: 100%;">
            <div style="background-color: yellow; height: 30px;"></div>
            <div id="inimigoVida" style="position: absolute; background-color: blue; top: 0; right: 0; bottom: 0; left: 0;"></div>
        </div>
        </div>

        <div id="textoDisplay" style="position: absolute; color: purple; align-items: center; justify-content: center; top: 0; right: 0; bottom: 0; left: 0; display: none;">Empate</div>

        <canvas id="gameWindow"> </canvas>

    </div>


        <audio id="somPulo" src="sons/pulo.mp3"></audio>
        <audio id="somAtaque" src="sons/ataque.mp3"></audio>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"
        integrity="sha512-VEBjfxWUOyzl0bAwh4gdLEaQyDYPvLrZql3pw1ifgb6fhEvZl9iDDehwHZ+dsMzA0Jfww8Xt7COSZuJ/slxc4Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="js/utilidades.js"></script>
        <script src="js/classes.js"></script>
        <script src="index.js"></script>
</body>

</html>
