<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo de Luta</title>
</head>

<body>
    <div class="container">
         <div id="menu" class="menu">

            <div class="title; animate-charcter">
                Jogo de Luta
            </div>
            <div class="options">
                <div id="1player" class="menuOption">
                    Player vs AI
                </div>
                <div id="2players" class="menuOption">
                    Player vs Player
                </div>
            </div>
        </div>

        
        <div id="hud" class="hud"> <!-- Heads Up Display -->

            <!-- vida do player -->
            <div class="layoutVida">
                <div class="remainingHealthbar"></div>
                <div id="playerVida" class="totalHealthBar"></div>
            </div>
            <!-- Timer -->
            <div id="timer" class="timer"> -- </div>

            <!-- vida inimigo -->
            <div class="layoutVida">
                <div class="remainingHealthbar"></div>
                <div id="inimigoVida" class="totalHealthBar"></div>
            </div>
        </div>
        <div id="result" class="result"> result </div>
        <div class="game">
            <canvas id="gameWindow"> </canvas>
        </div>
        
        <div class="information">
            <div class="controlesplayer">
            <div class="controles">
                <h1> Player 1 </h1>
                <p> Movimento: WASD </p>
                <p> Ataque: Espaço </p>
            </div>
            <div class="controles">
                <h1> Player 2 </h1>
                <p> Movimento: Setas </p>
                <p> Ataque: Shift </p>
            </div>
        </div>
    </div>

        <audio id="somPulo" src="sons/pulo.mp3"></audio>
        <audio id="somAtaque" src="sons/ataque.mp3"></audio>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"
        integrity="sha512-VEBjfxWUOyzl0bAwh4gdLEaQyDYPvLrZql3pw1ifgb6fhEvZl9iDDehwHZ+dsMzA0Jfww8Xt7COSZuJ/slxc4Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="index.js"> </script>
</body>

</html>
