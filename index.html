<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Jogo de Luta</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "New Rocker", system-ui;

        }
    </style>
</head>

<body>
    <!--conteiner vermelho-->
    <div style="position: relative; display: inline-block;">

        <!--conteiner vermelho menor-->
        <div style="
        position: absolute;
        display: flex;
        width: 100%;
        align-items: center;
        padding: 20px;">

            <!--vida do player-->
            <div style="
            position: relative;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            border-top: 4px solid white;
            border-left: 4px solid white;
            border-bottom: 4px solid white;">

                <div style="
                background-color: red;
                height: 30px;
                width: 100%;"></div>

                <div id="playerVida" style="
                position: absolute;
                background-color: #818cf8; 
                top: 0; right: 0; bottom: 0;
                width: 100%;"></div>

            </div>

            <!--timer-->
            <div id="timer" style="
            background-color: #20233e; 
            width: 100px; 
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color:white;
            border: 4px solid white;
            font-size: 45px;
            ">
                10
            </div>

            <!--vida inimigo-->
            <div style="
            position: relative;
            width: 100%;
            border-top: 4px solid white;
            border-right: 4px solid white;
            border-bottom: 4px solid white;">

                <div style="background-color: red; height: 30px;"></div>

                <div id="inimigoVida" style="
                position: absolute;
                background-color: #818cf8;
                top: 0; right: 0; bottom: 0; left: 0;"></div>
            </div>

        </div>

        <div id="textoDisplay" style="position: absolute;
        color: #818cf8;
        align-items: center;
        justify-content: center;
        top: 0; right: 0; bottom: 0; left: 0;
        display: none;
        font-size: 70px;
        -webkit-text-stroke: 2px #20233e;
        ">Empate</div>

        <canvas id="gameWindow"> </canvas>

    </div>


    <audio id="somPulo" src="sons/pulo.mp3"></audio>
    <audio id="somAtaque" src="sons/ataque.mp3"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"
        integrity="sha512-VEBjfxWUOyzl0bAwh4gdLEaQyDYPvLrZql3pw1ifgb6fhEvZl9iDDehwHZ+dsMzA0Jfww8Xt7COSZuJ/slxc4Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/classes.js"></script>
    <script src="index.js"></script>
</body>

</html>
